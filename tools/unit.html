      <select id="temp-from" onchange="convertUnit('temperature')">
        <option value="c">&#176;C</option><option value="f">&#176;F</option><option value="k">K</option>
      </select>
      <span class="unit-arrow">&#8594;</span>

        <option value="f">&#176;F</option><option value="c">&#176;C</option><option value="k">K</option>

      <input type="number" id="d-in" value="1" step="any" oninput="convertUnit('data')">

  </div>

  <div id="panel-area" class="tab-panel">
    <div class="unit-row">
      <input type="number" id="a-in" value="1" step="any" oninput="convertUnit('area')">
      <select id="a-from" onchange="convertUnit('area')">
        <option value="m2">m&#178;</option><option value="km2">km&#178;</option><option value="cm2">cm&#178;</option>
        <option value="ha">ha</option><option value="ac">ac</option><option value="ft2">ft&#178;</option>
      </select>
      <span class="unit-arrow">&#8594;</span>
      <select id="a-to" onchange="convertUnit('area')">
        <option value="ft2">ft&#178;</option><option value="m2">m&#178;</option><option value="km2">km&#178;</option>
        <option value="cm2">cm&#178;</option><option value="ha">ha</option><option value="ac">ac</option>

      <select id="s-from" onchange="convertUnit('speed')">

        <option value="kmh">km/h</option><option value="ms">m/s</option><option value="mph">mph</option>

<script>
const i18nData={
  zh:{
    home:'站点首页',tools:'工具集首页',lang:'English',backHome:'返回站点首页',backTools:'返回工具集首页',
    run:'运行',clear:'清空',copy:'复制',copied:'已复制',inputPlaceholder:'请输入...',
    error:'错误',loading:'加载中...',noResult:'暂无结果'
  },
  en:{
    home:'Site Home',tools:'Tools Home',lang:'中文',backHome:'Back to Site Home',backTools:'Back to Tools Home',
    run:'Run',clear:'Clear',copy:'Copy',copied:'Copied',inputPlaceholder:'Enter...',
    error:'Error',loading:'Loading...',noResult:'No result'
  }
};
let currentLang='zh';
function setLang(l){
  currentLang=l;
  document.documentElement.lang=l==='zh'?'zh-CN':'en';
  document.querySelectorAll('[data-zh],[data-en]').forEach(el=>{
    if(el.tagName==='INPUT'&&el.hasAttribute('placeholder')){
      el.placeholder=el.getAttribute('data-'+l);
    }else if(el.tagName==='TITLE'){
      document.title=el.getAttribute('data-'+l)||document.title;
    }else{
      el.textContent=el.getAttribute('data-'+l)||el.textContent;
    }
  });
  document.querySelectorAll('.lang-switch button').forEach(b=>b.classList.toggle('active',b.dataset.lang===l));
  localStorage.setItem('tools-lang',l);
}
function t(key){return(i18nData[currentLang]||i18nData.zh)[key]||key;}
document.addEventListener('DOMContentLoaded',()=>{
  const saved=localStorage.getItem('tools-lang')||'zh';
  setLang(saved);
  document.querySelectorAll('.lang-switch button').forEach(b=>{
    b.addEventListener('click',()=>setLang(b.dataset.lang));
  });
  document.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
      btn.classList.add('active');
      const panel=document.getElementById('panel-'+btn.dataset.tab);
      if(panel)panel.classList.add('active');
    });
  });
  ['length','weight','temperature','data','area','speed'].forEach(c=>convertUnit(c));
});
function escapeHtml(t){const d=document.createElement('div');d.textContent=t;return d.innerHTML;}
function copyText(t){navigator.clipboard.writeText(t).then(()=>alert(t('copied'))).catch(()=>{});}

const units={
  length:{base:'m',factors:{m:1,km:1000,cm:.01,mm:.001,mi:1609.344,yd:.9144,ft:.3048,in:.0254,nm:1e-9,um:1e-6}},
  weight:{base:'kg',factors:{kg:1,g:.001,mg:1e-6,t:1000,lb:.45359237,oz:.0283495}},
  data:{base:'b',factors:{b:1,kb:1024,mb:1048576,gb:1073741824,tb:1099511627776,pb:1125899906842624}},
  area:{base:'m2',factors:{m2:1,km2:1e6,cm2:1e-4,ha:1e4,ac:4046.856,ft2:.092903}},
  speed:{base:'ms',factors:{ms:1,kmh:.277778,mph:.44704,kn:.514444,fts:.3048}}
};
function convertTemp(v,from,to){
  let c;
  if(from==='c')c=v;else if(from==='f')c=(v-32)*5/9;else if(from==='k')c=v-273.15;
  if(to==='c')return c;else if(to==='f')return c*9/5+32;else if(to==='k')return c+273.15;
  return c;
}
function formatNum(n){
  if(Math.abs(n)<1e-6||Math.abs(n)>1e9)return n.toExponential(4);
  return parseFloat(n.toPrecision(10)).toString();
}
function convertUnit(type){
  if(type==='temperature'){
    const v=parseFloat(document.getElementById('temp-in').value)||0;
    const from=document.getElementById('temp-from').value;
    const to=document.getElementById('temp-to').value;
    const r=convertTemp(v,from,to);
    const labels={c:'°C',f:'°F',k:'K'};
    document.getElementById('temp-result').textContent=formatNum(r)+' '+labels[to];
    let html='<table><tr><th>'+(currentLang==='zh'?'单位':'Unit')+'</th><th>'+(currentLang==='zh'?'值':'Value')+'</th></tr>';
    ['c','f','k'].forEach(u=>{html+='<tr><td>'+labels[u]+'</td><td>'+formatNum(convertTemp(v,from,u))+'</td></tr>';});
    html+='</table>';
    document.getElementById('temp-all').innerHTML=html;
    return;
  }
  const u=units[type];if(!u)return;
  const prefix={length:'len',weight:'w',temperature:'temp',data:'d',area:'a',speed:'s'}[type];
  const v=parseFloat(document.getElementById(prefix+'-in').value)||0;
  const from=document.getElementById(prefix+'-from').value;
  const to=document.getElementById(prefix+'-to').value;
  const base=v*u.factors[from];
  const r=base/u.factors[to];
  document.getElementById(prefix+'-result').textContent=formatNum(r);
  let html='<table><tr><th>'+(currentLang==='zh'?'单位':'Unit')+'</th><th>'+(currentLang==='zh'?'值':'Value')+'</th></tr>';
  Object.keys(u.factors).forEach(k=>{html+='<tr><td>'+k+'</td><td>'+formatNum(base/u.factors[k])+'</td></tr>';});
  html+='</table>';
  document.getElementById(prefix+'-all').innerHTML=html;
}
</script>
