<style>
:root {
  --bg-main: #1a1d23;
  --bg-content: #22262e;
  --bg-card: #2a2f38;
  --bg-card-hover: #333945;
  --bg-navbar: #22262e;
  --bg-input: #2a2f38;
  --bg-btn: #3a7bd5;
  --bg-btn-hover: #2c62aa;
  --text-primary: #e0e0e0;
  --text-secondary: #a0a0a0;
  --text-muted: #707070;
  --border-color: #3a3f48;
  --link-color: #5dade2;
  --link-hover: #85c1e9;
  --accent: #3a7bd5;
  --accent-light: #5dade2;
  --success: #27ae60;
  --error: #e74c3c;
  --warning: #f39c12;
  --shadow: 0 2px 8px rgba(0,0,0,0.3);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg-main);color:var(--text-primary);line-height:1.6;min-height:100vh}
a{color:var(--link-color);text-decoration:none}a:hover{color:var(--link-hover)}
.navbar{display:flex;align-items:center;justify-content:space-between;padding:.75rem 1.5rem;background:var(--bg-navbar);border-bottom:1px solid var(--border-color);position:sticky;top:0;z-index:100;flex-wrap:wrap;gap:.5rem}
.navbar .brand{display:flex;align-items:center;gap:.5rem;font-weight:700;font-size:1.1rem;color:var(--text-primary)}
.navbar .brand svg{width:28px;height:28px;fill:var(--accent-light)}
.navbar .nav-links{display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.navbar .nav-links a{font-size:.9rem;color:var(--text-secondary);transition:color .2s}
.navbar .nav-links a:hover{color:var(--link-color)}
.lang-switch{display:flex;align-items:center;gap:.25rem;background:var(--bg-card);border:1px solid var(--border-color);border-radius:20px;padding:2px}
.lang-switch button{background:none;border:none;color:var(--text-muted);font-size:.8rem;padding:.25rem .6rem;border-radius:16px;cursor:pointer;transition:all .2s}
.lang-switch button.active{background:var(--accent);color:#fff}
.container{max-width:1100px;margin:0 auto;padding:1.5rem}
.card{background:var(--bg-card);border:1px solid var(--border-color);border-radius:10px;padding:1.5rem;margin-bottom:1.5rem;box-shadow:var(--shadow)}
.card-title{font-size:1.15rem;font-weight:600;margin-bottom:1rem;display:flex;align-items:center;gap:.5rem;color:var(--text-primary)}
.card-title .icon{font-size:1.3rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.55rem 1.1rem;background:var(--bg-btn);color:#fff;border:none;border-radius:6px;font-size:.9rem;cursor:pointer;transition:background .2s}
.btn:hover{background:var(--bg-btn-hover)}
.btn-secondary{background:var(--bg-card);color:var(--text-primary);border:1px solid var(--border-color)}
.btn-secondary:hover{background:var(--bg-card-hover)}
.btn-success{background:var(--success)}
.btn-sm{padding:.35rem .75rem;font-size:.8rem}
input,textarea,select{width:100%;padding:.6rem .8rem;background:var(--bg-input);border:1px solid var(--border-color);border-radius:6px;color:var(--text-primary);font-size:.9rem;font-family:inherit;transition:border-color .2s}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
textarea{resize:vertical;min-height:120px}
label{display:block;margin-bottom:.35rem;font-size:.85rem;color:var(--text-secondary)}
.form-row{display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}
.form-row .form-group{flex:1;min-width:200px}
.form-group{margin-bottom:1rem}
.result-area{background:var(--bg-main);border:1px solid var(--border-color);border-radius:6px;padding:1rem;margin-top:1rem;min-height:60px;white-space:pre-wrap;word-break:break-word;font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;font-size:.85rem;color:var(--text-secondary);max-height:400px;overflow:auto}
.result-area.success{border-color:var(--success);color:var(--text-primary)}
.result-area.error{border-color:var(--error);color:var(--error)}
.tabs{display:flex;gap:.25rem;border-bottom:2px solid var(--border-color);margin-bottom:1rem}
.tab-btn{padding:.5rem 1rem;background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:.9rem;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s}
.tab-btn.active{color:var(--accent-light);border-bottom-color:var(--accent-light)}
.tab-panel{display:none}
.tab-panel.active{display:block}
.grid-2{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1rem}
.grid-3{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1rem}
.tool-card{background:var(--bg-card);border:1px solid var(--border-color);border-radius:10px;padding:1.25rem;transition:all .2s;cursor:pointer}
.tool-card:hover{background:var(--bg-card-hover);transform:translateY(-2px);box-shadow:var(--shadow)}
.tool-card .tool-icon{font-size:2rem;margin-bottom:.5rem}
.tool-card .tool-name{font-weight:600;margin-bottom:.25rem;color:var(--text-primary)}
.tool-card .tool-desc{font-size:.8rem;color:var(--text-muted);line-height:1.4}
.badge{display:inline-block;padding:.15rem .45rem;border-radius:4px;font-size:.7rem;font-weight:600;text-transform:uppercase}
.footer{text-align:center;padding:2rem 1rem;color:var(--text-muted);font-size:.8rem;border-top:1px solid var(--border-color);margin-top:2rem}
.copy-hint{font-size:.75rem;color:var(--text-muted);margin-top:.35rem}
.action-bar{display:flex;gap:.5rem;margin-top:.75rem;flex-wrap:wrap}
.footer-links{display:flex;justify-content:center;gap:1rem;flex-wrap:wrap;margin-bottom:.75rem}
.footer-links a{font-size:.8rem;color:var(--text-muted);transition:color .2s}
.footer-links a:hover{color:var(--link-color)}
@media(max-width:640px){
  .container{padding:1rem}
  .navbar{padding:.6rem 1rem}
  .navbar .brand{font-size:1rem}
  .grid-2,.grid-3{grid-template-columns:1fr}
  .form-row{flex-direction:column;gap:.5rem}
}
.hidden{display:none!important}

</style>
</head>
<body>
<nav class="navbar">
  <a href="/cn/" class="brand">
    <img src="../assets/images/logo@2x.png" alt="009TG" style="height:28px;width:auto;border-radius:4px;">
    <span data-zh="009TG 工具箱" data-en="009TG Toolbox">009TG 工具箱</span>
  </a>
  <div class="nav-links">
    <a href="/cn/" data-zh="&#8592; 返回站点首页" data-en="&#8592; Back to Site Home">&#8592; 返回站点首页</a>
    <a href="./index.html" data-zh="&#8592; 返回工具集首页" data-en="&#8592; Back to Tools Home">&#8592; 返回工具集首页</a>
    <div class="lang-switch">
      <button data-lang="zh" class="active">中</button>
      <button data-lang="en">EN</button>
    </div>
  </div>
</nav>
<div class="container">
<h1 style="font-size:1.4rem;margin-bottom:1rem" data-zh="WHOIS 查询" data-en="WHOIS Lookup">WHOIS 查询</h1>
<div class="card">
  <div class="card-title"><span class="icon">&#128203;</span><span data-zh="域名注册信息查询" data-en="Domain Registration Lookup">域名注册信息查询</span></div>
  <div class="form-group">
    <label data-zh="域名" data-en="Domain">域名</label>
    <input type="text" id="whois-domain" placeholder="example.com" data-zh="输入要查询的域名（不含 www）" data-en="Enter domain (without www)">
  </div>
  <div class="action-bar">
    <button class="btn" onclick="lookupWHOIS()" data-zh="查询" data-en="Lookup">查询</button>
    <button class="btn btn-secondary" onclick="clearWHOIS()" data-zh="清空" data-en="Clear">清空</button>
  </div>
  <div id="whois-result" class="result-area" style="display:none"></div>
</div>
</div>
<footer class="footer">
  <div class="footer-links">
    <a href="/cn/about.html" data-zh="关于我们" data-en="About">关于我们</a>
    <a href="/cn/privacy.html" data-zh="隐私政策" data-en="Privacy Policy">隐私政策</a>
    <a href="/cn/contact.html" data-zh="联系我们" data-en="Contact">联系我们</a>
    <a href="/cn/disclaimer.html" data-zh="免责声明" data-en="Disclaimer">免责声明</a>
  </div>
  <p data-zh="009TG 工具箱 - 免费实用的在线工具集合" data-en="009TG Toolbox - Free & Practical Online Tools">009TG 工具箱 - 免费实用的在线工具集合</p>
</footer>
<script>
const i18nData={
  zh:{
    home:'站点首页',tools:'工具集首页',lang:'English',backHome:'返回站点首页',backTools:'返回工具集首页',
    run:'运行',clear:'清空',copy:'复制',copied:'已复制',inputPlaceholder:'请输入...',
    error:'错误',loading:'加载中...',noResult:'暂无结果'
  },
  en:{
    home:'Site Home',tools:'Tools Home',lang:'中文',backHome:'Back to Site Home',backTools:'Back to Tools Home',
    run:'Run',clear:'Clear',copy:'Copy',copied:'Copied',inputPlaceholder:'Enter...',
    error:'Error',loading:'Loading...',noResult:'No result'
  }
};
let currentLang='zh';
function setLang(l){
  currentLang=l;
  document.documentElement.lang=l==='zh'?'zh-CN':'en';
  document.querySelectorAll('[data-zh],[data-en]').forEach(el=>{
    if(el.tagName==='INPUT'&&el.hasAttribute('placeholder')){
      el.placeholder=el.getAttribute('data-'+l);
    }else if(el.tagName==='TITLE'){
      document.title=el.getAttribute('data-'+l)||document.title;
    }else{
      el.textContent=el.getAttribute('data-'+l)||el.textContent;
    }
  });
  document.querySelectorAll('.lang-switch button').forEach(b=>b.classList.toggle('active',b.dataset.lang===l));
  localStorage.setItem('tools-lang',l);
}
function t(key){return(i18nData[currentLang]||i18nData.zh)[key]||key;}
document.addEventListener('DOMContentLoaded',()=>{
  const saved=localStorage.getItem('tools-lang')||'zh';
  setLang(saved);
  document.querySelectorAll('.lang-switch button').forEach(b=>{
    b.addEventListener('click',()=>setLang(b.dataset.lang));
  });
});
function escapeHtml(t){
  const d=document.createElement('div');d.textContent=t;return d.innerHTML;
}
function copyText(t){
  navigator.clipboard.writeText(t).then(()=>alert(t('copied'))).catch(()=>{});
}

function lookupWHOIS(){
  const domain=document.getElementById('whois-domain').value.trim().toLowerCase();
  if(!domain){alert('Please enter a domain');return;}
  // Basic validation
  if(!/^[a-z0-9\-]+(\.[a-z0-9\-]+)+$/i.test(domain)){alert('Invalid domain format');return;}
  const r=document.getElementById('whois-result');r.style.display='block';
  r.textContent=t('loading');r.className='result-area';
  fetch('https://rdap.org/domain/'+encodeURIComponent(domain),{headers:{'Accept':'application/rdap+json'}})
    .then(res=>{if(!res.ok)throw new Error('HTTP '+res.status);return res.json();})
    .then(data=>{
      let out='';
      out+='Domain: '+(data.ldhName||domain)+'\n';
      out+='Handle: '+(data.handle||'N/A')+'\n';
      // Events
      const events=data.events||[];
      const reg=events.find(e=>e.eventAction==='registration');
      const exp=events.find(e=>e.eventAction==='expiration');
      const changed=events.find(e=>e.eventAction==='last changed');
      if(reg)out+='Registration: '+reg.eventDate+'\n';
      if(exp)out+='Expiration: '+exp.eventDate+'\n';
      if(changed)out+='Last Changed: '+changed.eventDate+'\n';
      // Status
      if(data.status&&data.status.length)out+='Status: '+data.status.join(', ')+'\n';
      // Nameservers
      const ns=data.nameservers||[];
      if(ns.length)out+='Nameservers:\n  '+ns.map(n=>n.ldhName).join('\n  ')+'\n';
      // Registrar
      const entities=data.entities||[];
      const registrar=entities.find(e=>e.roles&&e.roles.includes('registrar'));
      if(registrar){
        const vcard=(registrar.vcardArray&&registrar.vcardArray[1])||[];
        const fn=vcard.find(v=>v[0]==='fn');
        out+='Registrar: '+(fn?fn[2]||fn[3]:'N/A')+'\n';
        const pubids=registrar.publicIds||[];
        const iana=pubids.find(p=>p.type==='IANA Registrar ID');
        if(iana)out+='Registrar IANA ID: '+iana.identifier+'\n';
      }
      // Abuse contact
      const abuse=entities.flatMap(e=>e.entities||[]).find(e=>e.roles&&e.roles.includes('abuse'));
      if(abuse){
        const vcard=(abuse.vcardArray&&abuse.vcardArray[1])||[];
        const email=vcard.find(v=>v[0]==='email');
        const tel=vcard.find(v=>v[0]==='tel');
        if(email||tel)out+='Abuse Contact:\n';
        if(email)out+='  Email: '+email[3]+'\n';
        if(tel)out+='  Phone: '+tel[3]+'\n';
      }
      r.textContent=out||'No detailed information available.';r.className='result-area success';
    })
    .catch(e=>{r.textContent=t('error')+': '+e.message;r.className='result-area error';});
}
function clearWHOIS(){const r=document.getElementById('whois-result');r.textContent='';r.style.display='none';r.className='result-area';document.getElementById('whois-domain').value='';}

</script>
</body>
</html>
