<script>
const i18nData={
  zh:{
    home:'站点首页',tools:'工具集首页',lang:'English',backHome:'返回站点首页',backTools:'返回工具集首页',
    run:'运行',clear:'清空',copy:'复制',copied:'已复制',inputPlaceholder:'请输入...',
    error:'错误',loading:'加载中...',noResult:'暂无结果'
  },
  en:{
    home:'Site Home',tools:'Tools Home',lang:'中文',backHome:'Back to Site Home',backTools:'Back to Tools Home',
    run:'Run',clear:'Clear',copy:'Copy',copied:'Copied',inputPlaceholder:'Enter...',
    error:'Error',loading:'Loading...',noResult:'No result'
  }
};
let currentLang='zh';
function setLang(l){
  currentLang=l;
  document.documentElement.lang=l==='zh'?'zh-CN':'en';
  document.querySelectorAll('[data-zh],[data-en]').forEach(el=>{
    if(el.tagName==='INPUT'&&el.hasAttribute('placeholder')){
      el.placeholder=el.getAttribute('data-'+l);
    }else if(el.tagName==='TITLE'){
      document.title=el.getAttribute('data-'+l)||document.title;
    }else{
      el.textContent=el.getAttribute('data-'+l)||el.textContent;
    }
  });
  document.querySelectorAll('.lang-switch button').forEach(b=>b.classList.toggle('active',b.dataset.lang===l));
  localStorage.setItem('tools-lang',l);
}
function t(key){return(i18nData[currentLang]||i18nData.zh)[key]||key;}
document.addEventListener('DOMContentLoaded',()=>{
  const saved=localStorage.getItem('tools-lang')||'zh';
  setLang(saved);
  document.querySelectorAll('.lang-switch button').forEach(b=>{
    b.addEventListener('click',()=>setLang(b.dataset.lang));
  });
});
function escapeHtml(t){
  const d=document.createElement('div');d.textContent=t;return d.innerHTML;
}
function copyText(t){
  navigator.clipboard.writeText(t).then(()=>alert(t('copied'))).catch(()=>{});
}

function tsToDate(){
  const ts=parseInt(document.getElementById('ts-input').value.trim());
  const tz=document.getElementById('ts-tz').value;
  const r=document.getElementById('ts-result');r.style.display='block';
  if(isNaN(ts)){r.textContent='Invalid timestamp';r.className='result-area error';return;}
  try{
    const d=new Date(ts*1000);
    const fmt=new Intl.DateTimeFormat('en-US',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
    const iso=d.toISOString();
    r.textContent='Local: '+d.toLocaleString()+'\nUTC: '+iso+'\nFormatted ('+tz+'): '+fmt.format(d)+'\nTimestamp (s): '+ts+'\nTimestamp (ms): '+(ts*1000);
    r.className='result-area success';
  }catch(e){r.textContent=t('error')+': '+e.message;r.className='result-area error';}
}
function dateToTs(){
  const y=parseInt(document.getElementById('d-year').value)||0;
  const m=parseInt(document.getElementById('d-month').value)||0;
  const d=parseInt(document.getElementById('d-day').value)||0;
  const h=parseInt(document.getElementById('d-hour').value)||0;
  const min=parseInt(document.getElementById('d-min').value)||0;
  const s=parseInt(document.getElementById('d-sec').value)||0;
  const tz=document.getElementById('d-tz').value;
  const r=document.getElementById('ts-result');r.style.display='block';
  try{
    const dateStr=y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0')+'T'+String(h).padStart(2,'0')+':'+String(min).padStart(2,'0')+':'+String(s).padStart(2,'0');
    // For non-UTC, we construct date in that timezone
    let utcMs;
    if(tz==='UTC'){utcMs=Date.parse(dateStr+'Z');}
    else{
      // Use Intl to get timezone offset
      const testDate=new Date(Date.parse(dateStr+'Z'));
      const fmt=new Intl.DateTimeFormat('en-US',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
      const parts=fmt.formatToParts(testDate);
      const get=(t)=>parts.find(p=>p.type===t)?.value;
      const localStr=get('year')+'-'+get('month')+'-'+get('day')+'T'+get('hour')+':'+get('minute')+':'+get('second');
      const localMs=Date.parse(localStr+'Z');
      const offset=localMs-testDate.getTime();
      utcMs=Date.parse(dateStr+'Z')-offset;
    }
    if(isNaN(utcMs)){r.textContent='Invalid date';r.className='result-area error';return;}
    r.textContent='Timestamp (s): '+Math.floor(utcMs/1000)+'\nTimestamp (ms): '+utcMs+'\nUTC: '+new Date(utcMs).toISOString()+'\nLocal: '+new Date(utcMs).toLocaleString();
    r.className='result-area success';
  }catch(e){r.textContent=t('error')+': '+e.message;r.className='result-area error';}
}
function useNow(){document.getElementById('ts-input').value=Math.floor(Date.now()/1000);tsToDate();}
function fillNow(){
  const n=new Date();
  document.getElementById('d-year').value=n.getFullYear();
  document.getElementById('d-month').value=n.getMonth()+1;
  document.getElementById('d-day').value=n.getDate();
  document.getElementById('d-hour').value=n.getHours();
  document.getElementById('d-min').value=n.getMinutes();
  document.getElementById('d-sec').value=n.getSeconds();
}
document.querySelectorAll('.tab-btn').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.tab-btn').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    document.getElementById('panel-'+b.dataset.tab).classList.add('active');
  });
});

</script>
