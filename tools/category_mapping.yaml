# ============================================================
# 分类映射表 - category_mapping.yaml
# ============================================================
# 作用：将各抓取源站的分类名统一映射到本站点的标准分类名
# 格式：
#   源站名:
#     源分类名: 目标分类名
#
# 规则：
#   1. 目标分类名如果已存在于完整版导航.json，直接使用
#   2. 目标分类名如果不存在，build_data.py 会自动创建（父分类为 _default.parent_category）
#   3. 未在映射表中出现的源分类，默认放到 _default.fallback_category
#   4. 新增抓取源站时，只需在下方追加该站的分类映射，无需修改抓取脚本
# ============================================================

# 默认配置
_default:
  parent_category: AI工具        # 新建分类的父分类
  fallback_category: AI常用工具   # 未匹配分类的兜底分类

# ============================================================
# AI地带 (aididai.cn)
# ============================================================
AI地带:
  # 能匹配到现有分类的
  AI写作工具: AI写作工具
  AI视频工具: AI视频工具
  AI设计工具: AI设计工具
  AI编程: AI编程工具
  AI办公: AI办公工具
  AI短剧视频: AI视频工具        # 短剧视频归到AI视频工具
  AI公众号: AI常用工具           # 公众号无独立网站，归到常用工具

  # 需要新建的分类
  AI图像工具: AI图像工具
  AI Agent/智能体: AI Agent智能体
  AI对话: AI对话
  AI翻译: AI翻译
