<!DOCTYPE html>
<html>
<head>
    <title>测试图片加载</title>
</head>
<body>
    <h1>测试图片加载</h1>
    
    <h2>账号星球的favicon</h2>
    <img src="assets/favicons/7dadb4e62aa7584241decf0aa741471a.png" width="40" onerror="this.src='assets/images/logos/default.png'; console.log('图片加载失败，使用默认图标')">
    <p>原始路径: assets/favicons/7dadb4e62aa7584241decf0aa741471a.png</p>
    
    <h2>默认图标</h2>
    <img src="assets/images/logos/default.png" width="40">
    <p>默认路径: assets/images/logos/default.png</p>
    
    <script>
        window.addEventListener('load', function() {
            console.log('页面加载完成');
            
            const img = document.querySelector('img[src="assets/favicons/7dadb4e62aa7584241decf0aa741471a.png"]');
            if (img) {
                console.log('找到账号星球图片元素');
                console.log('图片自然宽度:', img.naturalWidth);
                console.log('图片自然高度:', img.naturalHeight);
                console.log('图片显示宽度:', img.width);
                console.log('图片显示高度:', img.height);
                console.log('图片完整状态:', img.complete);
            } else {
                console.log('未找到账号星球图片元素');
            }
        });
        
        document.addEventListener('error', function(e) {
            if (e.target.tagName === 'IMG') {
                console.log('图片加载失败:', e.target.src);
            }
        }, true);
    </script>
</body>
</html>
