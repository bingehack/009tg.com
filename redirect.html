    <script>
        function getQueryParam(name) {
            var urlParams = window.location.search.substring(1);
            var params = urlParams.split('&');
            for (var i = 0; i < params.length; i++) {
                var param = params[i].split('=');
                if (param[0] === name) {
                    return decodeURIComponent(param[1]);
                }
            }
            return null;
        }
        
        $(document).ready(function() {
            var targetUrl = getQueryParam('url');
            var siteName = getQueryParam('name');
            
            if (targetUrl) {
                $('#targetUrl').text(targetUrl);
                $('#manualRedirect').attr('href', targetUrl);
                
                var countdown = 3;
                var timer = setInterval(function() {
                    countdown--;
                    $('#countdown').text(countdown);
                    
                    if (countdown <= 0) {
                        clearInterval(timer);
                        window.location.href = targetUrl;
                    }
                }, 1000);
            } else {
                $('#targetUrl').text('未找到目标地址');
                $('.redirect-timer').hide();
                $('#manualRedirect').hide();
            }
        });
    </script>

    <!-- 深色模式主题切换 -->
    <script>
        function initTheme() {
            var savedTheme = localStorage.getItem('theme');
            if (savedTheme) {
                document.documentElement.setAttribute('data-theme', savedTheme);
                updateThemeIcon(savedTheme);
            } else {
                if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    updateThemeIcon('dark');
                }
            }
        }
        function toggleTheme() {
            var currentTheme = document.documentElement.getAttribute('data-theme');
            var newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        }
        function updateThemeIcon(theme) {
            var icon = document.getElementById('theme-icon');
            if (icon) {
                if (theme === 'dark') {
                    icon.className = 'fa-sun-o';
                    icon.parentElement.title = '切换到浅色模式';
                } else {
                    icon.className = 'fa-moon-o';
                    icon.parentElement.title = '切换到深色模式';
                }
            }
        }
        initTheme();
        if (window.matchMedia) {
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
                if (!localStorage.getItem('theme')) {
                    if (e.matches) {
                        document.documentElement.setAttribute('data-theme', 'dark');
                        updateThemeIcon('dark');
                    } else {
                        document.documentElement.removeAttribute('data-theme');
                        updateThemeIcon('light');
                    }
                }
            });
        }
    </script>
