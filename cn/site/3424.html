    <script>
        // 深色模式
        function toggleTheme() {
            var current = document.documentElement.getAttribute('data-theme');
            var newTheme = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            document.getElementById('theme-icon').className = newTheme === 'dark' ? 'fa-sun-o' : 'fa-moon-o';
        }
        (function() {
            var saved = localStorage.getItem('theme');
            if (saved) {
                document.documentElement.setAttribute('data-theme', saved);
                document.getElementById('theme-icon').className = saved === 'dark' ? 'fa-sun-o' : 'fa-moon-o';
            }
        })();
        
        // 复制URL
        function copyUrl() {
            navigator.clipboard.writeText('https://tikrank.com').then(function() {
                var btn = event.target.closest('button');
                var original = btn.innerHTML;
                btn.innerHTML = '<i class="fa-check" style="margin-right: 6px;"></i>已复制';
                setTimeout(function() { btn.innerHTML = original; }, 2000);
            });
        }
